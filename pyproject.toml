[project]
name = "t3co"
version = "2.0.0"
dynamic = ["dependencies"]
description = "NLR's Transportation Technology Total Cost of Ownership tool"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    {name = "Harish Panneer Selvam", email = "Harish.PanneerSelvam@nlr.gov"},
    {name = "Alicia Birky", email = "Alicia.Birky@nlr.gov"},
]
maintainers = [{name = "NLR-AVCI", email = "t3co@nlr.gov"}]
keywords = ["tco", "vehicle-cost", "total-cost", "vehicle-simulation", "total-cost-of-ownership"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",    
]
requires-python = ">=3.9,<4"

[tool.poetry.dependencies]
python = ">=3.9,<4"
pandas = ">=2.0.0"
numpy = [
    {version = ">=1.26.0,<2", python = ">=3.9,<3.13"},
    {version = ">=2.1.0", python = ">=3.13"}
]
zipcodes = "^1.3.0"
requests = "^2.28.0"
scipy = [
    {version = "^1.11.0", python = ">=3.9,<3.10"},
    {version = "^1.13.0", python = ">=3.10"}
]
pymoo = ">=0.6.0,<0.7"
fastsim = { version = ">=2.1.1,<3", python = ">=3.9,<3.11", optional = true }

[project.optional-dependencies]
fastsim = ["fastsim>=2.1.1,<3; python_version < '3.11'"]
dev = ["pytest", "pytest-mock", "fastsim>=2.1.1,<3; python_version < '3.11'", "ruff"]

[project.scripts]
install_t3co_demo_inputs = "t3co.utils.demo_inputs_installer:main"
t3co_summarize = "t3co.tco.summary:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "t3co", from = "src"}]

[project.urls]
Homepage = "https://www.nlr.gov/transportation/t3co.html"
Documentation = "https://natlabrockies.github.io/T3CO/"
Repository = "https://github.com/NatLabRockies/T3CO"
"Bug Tracker" = "https://github.com/NatLabRockies/T3CO/issues"
